<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | White Space Designs</title>
  <meta name="description" content="Page not found — White Space Designs." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23ff3b30'><animate attributeName='r' values='7;10;7' dur='1.8s' repeatCount='indefinite'/><animate attributeName='opacity' values='1;0.55;1' dur='1.8s' repeatCount='indefinite'/></circle></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:   #0a0a0a;
      --bg2:  #111111;
      --sf:   #161616;
      --sf2:  #1c1c1c;
      --bdr:  rgba(255,255,255,.13);
      --bdr2: rgba(255,255,255,.07);
      --txt:  #ffffff;
      --mt:   #aaaaaa;
      --dim:  #8e8e8e;
      --red:  #ff3b30;
      --fnt:  'Inter', system-ui, sans-serif;
      --mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--fnt); background: var(--bg); color: var(--txt); line-height: 1.6; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: rgba(255,59,48,.25); color: #fff; }

    .wrap { max-width: 860px; margin: 0 auto; padding: 0 32px; }

    nav {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--bdr);
      background: rgba(10,10,10,.92);
      backdrop-filter: blur(12px);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: .72rem;
      letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    }
    .logo-dot {
      width: 8px; height: 8px; background: var(--red); border-radius: 50%;
      flex-shrink: 0;
    }
    .nav-back {
      font-family: var(--mono); font-size: .68rem;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--mt); display: flex; align-items: center; gap: 8px;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--txt); }
    .nav-back svg { width: 14px; height: 14px; }

    .error-hero {
      min-height: calc(100svh - 64px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 20px; padding: 80px 32px;
    }
    .error-code {
      font-family: var(--mono); font-weight: 700;
      font-size: clamp(5rem, 18vw, 11rem);
      line-height: 0.9; color: var(--red);
    }
    .error-hero h1 {
      font-size: clamp(1.5rem, 3.5vw, 2.25rem);
      font-weight: 600; letter-spacing: -0.01em;
    }
    .error-hero p {
      max-width: 44ch; color: var(--mt); font-size: 0.95rem;
    }
    .error-link {
      margin-top: 12px;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: .72rem;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 14px 28px; background: var(--red); color: #fff;
      border-radius: 4px; transition: opacity .2s;
    }
    .error-link:hover { opacity: .85; }
  </style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a href="index.html" class="logo">
      <div class="logo-dot"></div>
      White Space Designs
    </a>
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to site
    </a>
  </div>
</nav>

<section class="error-hero">
  <div class="error-code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>The page you're looking for has been moved, renamed, or never existed. Let's get you back on track.</p>
  <a href="index.html" class="error-link">Back to Home</a>
</section>

</body>
</html>
