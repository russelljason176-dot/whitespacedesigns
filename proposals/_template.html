<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>WSD Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a; --bg2: #111111; --sf: #161616;
    --bdr: rgba(255,255,255,.13); --bdr2: rgba(255,255,255,.07);
    --txt: #ffffff; --mt: #aaaaaa; --dim: #8e8e8e;
    --red: #ff3b30;
    --fnt: 'Inter', system-ui, sans-serif;
    --mono: 'Space Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--fnt); background: var(--bg); color: var(--txt); line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 60px 24px 120px; }
  .label { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 56px; flex-wrap: wrap; gap: 16px; }
  .brand { font-family: var(--mono); font-size: .8rem; letter-spacing: .1em; }
  .meta { text-align: right; }
  .meta .label { margin-bottom: 4px; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; letter-spacing: -.01em; margin: 8px 0 4px; }
  .sub { color: var(--mt); font-size: 1.02rem; max-width: 60ch; }
  section { margin-top: 56px; }
  section h2 { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--bdr2); }
  .summary-text { color: var(--mt); font-size: .98rem; max-width: 62ch; }
  .scope-item { padding: 20px 0; border-bottom: 1px solid var(--bdr2); }
  .scope-item:last-child { border-bottom: none; }
  .scope-item h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
  .scope-item p { color: var(--mt); font-size: .92rem; }
  ul.deliverables { list-style: none; }
  ul.deliverables li { padding: 10px 0 10px 24px; position: relative; color: var(--mt); font-size: .95rem; border-bottom: 1px solid var(--bdr2); }
  ul.deliverables li:last-child { border-bottom: none; }
  ul.deliverables li::before { content: "→"; position: absolute; left: 0; color: var(--red); font-family: var(--mono); }
  .timeline-row { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--bdr2); align-items: baseline; }
  .timeline-row:last-child { border-bottom: none; }
  .timeline-row .phase { font-family: var(--mono); font-size: .72rem; color: var(--red); min-width: 90px; }
  .timeline-row .desc { color: var(--mt); font-size: .92rem; }
  .invest-card { background: var(--sf); border: 1px solid var(--bdr); border-radius: 4px; padding: 32px; }
  .invest-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--bdr2); font-size: .95rem; }
  .invest-row:last-child { border-bottom: none; }
  .invest-row.total { font-weight: 600; font-size: 1.1rem; padding-top: 20px; }
  .invest-row .val { font-family: var(--mono); }
  .terms { color: var(--dim); font-size: .82rem; margin-top: 20px; line-height: 1.7; }
  .next-steps { counter-reset: step; }
  .next-steps li { list-style: none; counter-increment: step; padding: 16px 0 16px 40px; position: relative; border-bottom: 1px solid var(--bdr2); color: var(--mt); font-size: .92rem; }
  .next-steps li:last-child { border-bottom: none; }
  .next-steps li::before { content: counter(step); position: absolute; left: 0; top: 16px; width: 24px; height: 24px; border: 1px solid var(--bdr); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: .7rem; color: var(--txt); }
  .cta { margin-top: 56px; padding: 32px; background: var(--sf); border: 1px solid var(--bdr); border-radius: 4px; text-align: center; }
  .cta p { color: var(--mt); font-size: .92rem; margin-bottom: 20px; }
  .btn { display: inline-block; padding: 14px 32px; background: var(--red); color: #fff; font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
  footer { margin-top: 56px; text-align: center; }
  footer .label { color: var(--dim); }
  .validity { margin-top: 12px; font-family: var(--mono); font-size: .7rem; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ══════════════════════════════════════════════════════════
   EDIT ONLY THIS OBJECT PER CLIENT — everything below renders
   itself from these values. Duplicate this file into a new folder
   named after the client, e.g. proposals/<client-slug>/index.html,
   fill this in, push, then send the link:
   whitespacedesigns.co.za/proposals/<client-slug>/
   ══════════════════════════════════════════════════════════ */
const DATA = {
  clientName:      "Client Name",
  companyName:     "Company Name",
  proposalDate:     new Date().toLocaleDateString('en-ZA', { year:'numeric', month:'long', day:'numeric' }),
  validDays:        14,

  servicesLine:    "Web Design", // e.g. "Web Design" / "AI Agents" / "Web Design + AI Automation"

  summary: "A short paragraph in your own words: what they came to you with, what you're proposing to build, and the outcome it gets them. Write this specific to the call, never generic.",

  scope: [
    { title: "Discovery & Strategy", desc: "Confirm goals, audience, and what the site/system needs to do before anything gets built." },
    { title: "Design", desc: "Custom design, not a template — built around how their actual clients make decisions." },
    { title: "Build", desc: "Development, testing across devices, and integration with any tools they already run on." },
  ],

  deliverables: [
    "Fully custom-designed, responsive website",
    "Mobile optimisation",
    "Contact/enquiry form wired to their inbox",
    "Basic on-page SEO setup",
  ],

  timeline: [
    { phase: "Week 1", desc: "Discovery, content gathering, initial design direction" },
    { phase: "Week 2", desc: "Design review + revisions" },
    { phase: "Week 3", desc: "Build, testing, launch" },
  ],

  currency:   "ZAR",       // ZAR or USD/GBP/EUR for international clients
  symbol:     "R",
  total:      9500,
  depositPct: 50,

  paymentNote: "50% deposit due before work begins, balance due on delivery. Payment link sent separately once you confirm.", // NOTE (2026-09-04): don't reference Yoco by name here until WSD has its own account (see wsd-139) — currently only a personal account exists that can't be used for WSD invoices.

  nextSteps: [
    "Reply to this proposal or the email it came with to confirm you're happy to proceed.",
    "You'll get a deposit invoice (50% of total) — work begins once that's paid.",
    "You'll receive a short intake form to gather brand assets, content, and access details.",
    "Kickoff — build begins per the timeline above.",
  ],
};
/* ══════════════════════════════════════════════════════════ */

function fmt(n) { return DATA.symbol + n.toLocaleString(); }

const deposit = Math.round(DATA.total * DATA.depositPct / 100);
const balance = DATA.total - deposit;

const validUntil = new Date();
validUntil.setDate(validUntil.getDate() + DATA.validDays);
const validUntilStr = validUntil.toLocaleDateString('en-ZA', { year:'numeric', month:'long', day:'numeric' });

document.getElementById('app').innerHTML = `
  <header>
    <div class="brand">WHITE SPACE DESIGNS</div>
    <div class="meta">
      <div class="label">Proposal</div>
      <div class="label">${DATA.proposalDate}</div>
    </div>
  </header>

  <div>
    <div class="label">Prepared for ${DATA.clientName} — ${DATA.companyName}</div>
    <h1>${DATA.servicesLine}</h1>
    <p class="sub">${DATA.summary}</p>
  </div>

  <section>
    <h2>Scope of Work</h2>
    ${DATA.scope.map(s => `
      <div class="scope-item">
        <h3>${s.title}</h3>
        <p>${s.desc}</p>
      </div>
    `).join('')}
  </section>

  <section>
    <h2>What You Get</h2>
    <ul class="deliverables">
      ${DATA.deliverables.map(d => `<li>${d}</li>`).join('')}
    </ul>
  </section>

  <section>
    <h2>Timeline</h2>
    ${DATA.timeline.map(t => `
      <div class="timeline-row">
        <div class="phase">${t.phase}</div>
        <div class="desc">${t.desc}</div>
      </div>
    `).join('')}
  </section>

  <section>
    <h2>Investment</h2>
    <div class="invest-card">
      <div class="invest-row total"><span>Total</span><span class="val">${fmt(DATA.total)}</span></div>
      <div class="invest-row"><span>Deposit (${DATA.depositPct}%) — due to start</span><span class="val">${fmt(deposit)}</span></div>
      <div class="invest-row"><span>Balance — due on delivery</span><span class="val">${fmt(balance)}</span></div>
    </div>
    <p class="terms">${DATA.paymentNote}</p>
  </section>

  <section>
    <h2>Next Steps</h2>
    <ol class="next-steps">
      ${DATA.nextSteps.map(n => `<li>${n}</li>`).join('')}
    </ol>
  </section>

  <div class="cta">
    <p>Questions before you decide? Just reply — happy to walk through any of this on a call.</p>
    <a class="btn" href="mailto:studio@whitespacedesigns.co.za?subject=Re: Proposal — ${encodeURIComponent(DATA.companyName)}">Confirm & Proceed</a>
  </div>

  <footer>
    <div class="label">Jason Russell — White Space Designs</div>
    <div class="validity">This proposal is valid until ${validUntilStr}</div>
  </footer>
`;
</script>
</body>
</html>
